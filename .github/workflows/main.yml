name: KODATTORIA サイト 自動ビルド

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

# 同時実行による競合を防ぐ設定
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4
        with:
          # 最新の状態を確実に取得
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリをインストール
        run: pip install requests pillow python-dotenv

      - name: サイトをビルド
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MAG_DB_ID: ${{ secrets.NOTION_MAG_DB_ID }}
        run: python build.py

      - name: 変更をコミットしてプッシュ
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          
          # 最新の状態にリセット
          git fetch origin main
          git reset --hard origin/main
          
          git add -A
          
          # 変更がある場合のみコミット・プッシュを実行
          if ! git diff --staged --quiet; then
            git commit -m "auto: Notionからサイトを再生成 [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
