name: KODATTORIA サイト 自動ビルド

on:
  # Notion DBに変更があったときに手動実行
  workflow_dispatch:
  # 毎月定期実行（毎月1日 09:00 JST = 00:00 UTC）
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 依存ライブラリをインストール
        run: pip install requests pillow python-dotenv

      - name: サイトをビルド
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_MAG_DB_ID: ${{ secrets.NOTION_MAG_DB_ID }}
        run: python build.py

      - name: 変更をコミット
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto: Notionからサイトを再生成 [$(date +'%Y-%m-%d')]"
          git push
# Cloudflare Pagesはmainブランチへのpushで自動デプロイされる
